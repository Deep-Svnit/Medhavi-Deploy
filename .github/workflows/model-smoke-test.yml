name: Model smoke test

on:
  workflow_dispatch:

jobs:
  inference:
    name: Run real pipeline inference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run ONNX inference against bundled sample
        run: node --input-type=module -e "import {tryOnnxInference} from './inference/onnx_inference.js'; const r=await tryOnnxInference('storage/uploads/image-1758187869194-607778446.jpg'); if (!r.success) { console.error(r); process.exit(1) }; console.log(r.top.slice(0, 5))"
