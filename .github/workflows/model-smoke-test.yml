name: Model smoke test

on:
  workflow_dispatch:

jobs:
  inference:
    name: Run real pipeline inference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Run inference against bundled sample
        run: |
          python inference/run_pipeline.py \
            --pipeline models/phytoplankton_full_pipeline.pkl \
            --image storage/uploads/image-1758187869194-607778446.jpg \
            --topk 5
