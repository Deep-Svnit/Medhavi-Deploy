services:
  - type: web
    name: medhavi-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && pip install -r requirements.txt
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_MODE
        value: "false"
      - key: PIPELINE_PATH
        value: ./models/phytoplankton_full_pipeline.pkl
      - key: CORS_ORIGINS
        sync: false
